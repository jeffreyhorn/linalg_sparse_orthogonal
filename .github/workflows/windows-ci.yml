name: Windows CI

# Windows currently enforces the reviewed CMake subset only:
# configure + build + `ctest -N` + full `ctest`. The Makefile reviewed
# wrappers and dead-code flow remain staged, and the current excluded
# tests remain explicit in job output. In particular, `test_fuzz` is still
# outside the reviewed Windows subset, so the bounded lifecycle
# property/fuzz lane is not claimed as reviewed Windows evidence. This lane
# should be read as reviewed CMake-first consumer proof only; it is not a
# separate reviewed install-validation lane and does not imply Windows
# Makefile parity.
# See README.md "Cross-Platform CI Contract" for the full model.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    name: Windows enforced reviewed CMake consumer subset (MSVC)
    # This reviewed lane depends on the VS 2022 generator being present.
    # `windows-latest` no longer guarantees that, so pin the runner to the
    # image that actually carries the reviewed MSVC/CMake surface.
    runs-on: windows-2022
    env:
      EXPECTED_WINDOWS_CTEST_COUNT: "51"
    steps:
      - uses: actions/checkout@v4

      # CMake ships preinstalled on GitHub's Windows images, so no setup
      # step is needed. This lane is pinned to `windows-2022` specifically
      # because it must provide the VS 2022 generator.

      - name: Run enforced reviewed CMake configure path (MSVC, x64)
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64
        shell: pwsh

      - name: Run enforced reviewed CMake build path (Release)
        run: cmake --build build --config Release
        shell: pwsh

      - name: Inspect enforced Windows reviewed consumer CTest surface (ctest -N)
        run: |
          $ctestOutput = ctest --test-dir build -C Release -N
          $ctestOutput
          $line = $ctestOutput | Select-String "Total Tests:"
          if (-not $line) {
            throw "Could not find 'Total Tests:' in Windows ctest -N output."
          }
          $count = [int]($line.ToString().Split(':')[-1].Trim())
          Write-Host "Windows CTest registered tests: $count"
          if ($count -ne [int]$env:EXPECTED_WINDOWS_CTEST_COUNT) {
            throw "Expected $env:EXPECTED_WINDOWS_CTEST_COUNT Windows CTest tests, got $count."
          }
          Write-Host "Windows staged exclusions remain: test_threads, test_sprint4_integration, test_fuzz (including the bounded lifecycle property lane)"
          Write-Host "Windows reviewed scope remains CMake-first consumer proof only: no reviewed Makefile parity and no separate reviewed install-validation lane."
        shell: pwsh

      - name: Run enforced reviewed CMake execution path (ctest)
        run: ctest --test-dir build -C Release --output-on-failure
        shell: pwsh
