name: macOS CI

# macOS enforces the Apple Clang reviewed path plus platform-specific
# checks (`wall-check`, `sanitize`). The Homebrew GCC leg remains
# supplemental second-compiler coverage. The Make install/`pkg-config`
# job below is also supplemental: it strengthens confidence in the
# maintained static-first package story, but it does not claim reviewed
# install/export parity and does not widen macOS beyond the narrower
# reviewed Apple Clang lane. See README.md "Cross-Platform CI Contract"
# for the full model.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    name: macOS enforced Apple Clang reviewed path + supplemental GCC leg
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Clang: default `cc` on macos-latest images.  Add
          # ASan/UBSan via `make sanitize`.
          - compiler: apple-clang
            cc: cc
            run_sanitize: "true"
            run_reviewed_makefile: "true"
            run_reviewed_cmake: "true"
            run_direct_make_test: "false"
          # Homebrew GCC: requires `brew install gcc`.  The exact
          # binary name floats with Homebrew's gcc formula version;
          # use the unversioned symlink `gcc-15` (current Homebrew
          # default as of 2026-04).  Sanitize disabled because the
          # Homebrew gcc + libasan combo is less reliable than Apple
          # Clang's; the Linux CI tsan + Apple Clang sanitize cover
          # the equivalent ground.
          - compiler: homebrew-gcc
            cc: gcc-15
            run_sanitize: "false"
            run_reviewed_makefile: "false"
            run_reviewed_cmake: "false"
            run_direct_make_test: "true"
    steps:
      - uses: actions/checkout@v4

      # Apple Clang ships with the macos-latest image; no install
      # step needed.  Homebrew GCC needs an explicit `brew install`.
      - name: Install Homebrew GCC (matrix=homebrew-gcc)
        if: matrix.compiler == 'homebrew-gcc'
        run: brew install gcc

      # The reviewed compile-quality path depends on clang-format,
      # clang-tidy, and cppcheck. On macOS, use Homebrew LLVM +
      # cppcheck for the Apple Clang leg and add the LLVM bin dir
      # explicitly since the formula is keg-only.
      - name: Install reviewed-path tools (Apple Clang only)
        if: matrix.run_reviewed_makefile == 'true'
        run: |
          brew install llvm cppcheck
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"

      - name: Run enforced reviewed Makefile compile-quality path (Apple Clang only)
        if: matrix.run_reviewed_makefile == 'true'
        run: make quality-review-compile

      - name: Run enforced reviewed CMake parity path (Apple Clang only)
        if: matrix.run_reviewed_cmake == 'true'
        run: make quality-review-cmake

      - name: Run supplemental direct build path (matrix=${{ matrix.compiler }})
        if: matrix.run_direct_make_test == 'true'
        run: make CC=${{ matrix.cc }}

      - name: Run supplemental direct test path (matrix=${{ matrix.compiler }})
        if: matrix.run_direct_make_test == 'true'
        run: make CC=${{ matrix.cc }} test

      - name: Run enforced wall-check signal
        run: make CC=${{ matrix.cc }} wall-check

      - name: Run enforced Apple Clang sanitizer path
        if: matrix.run_sanitize == 'true'
        run: |
          make clean
          make CC=${{ matrix.cc }} sanitize

  # Verify the maintained static-first Make install/`pkg-config` path on
  # macOS. Lives in a separate supplemental job because it installs to a temp
  # prefix and runs verification commands. This job is confidence-building
  # support for the package story, not a reviewed macOS install/export parity
  # lane and not a substitute for the broader Unix-side local regression
  # scripts.
  install-and-pkgconfig:
    name: macOS supplemental static-first install and pkg-config confidence path
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run supplemental package-path build
        run: make

      - name: Run supplemental Make install to /tmp prefix
        run: make install PREFIX=/tmp/sparse-prefix

      - name: Run supplemental pkg-config consumer verification
        run: |
          export PKG_CONFIG_PATH=/tmp/sparse-prefix/lib/pkgconfig
          pkg-config --modversion sparse
          pkg-config --cflags sparse
          pkg-config --libs sparse

      - name: Run supplemental uninstall reversibility check
        run: make uninstall PREFIX=/tmp/sparse-prefix
