name: Windows CI

# Sprint 36 Day 6/9: Windows CI now frames the current Win32/MSVC
# contract as an enforced reviewed CMake subset rather than a generic
# "draft" build/test path.  Windows remains CMake-first for now:
#   - reviewed CMake configure/build signal
#   - `ctest -N` visibility into the registered Windows suite
#   - full `ctest` execution
#
# Staged but not yet enforced on Windows:
#   - no `make quality-review-compile`
#   - no `make quality-review`
#   - no dead-code path
#
# Current staged Windows exclusions remain explicit:
#   - `test_threads`
#   - `test_sprint4_integration`
#   - `test_fuzz`
#
# Expected failure modes the Sprint 29 Day-8 close targets:
#   - clock_gettime / CLOCK_MONOTONIC not available on MSVC (used by
#     the Sprint 29 Day 6/7 progress timing helpers).
#   - POSIX-only headers (unistd.h, sys/time.h) included unconditionally.
#   - Path separator handling in tests/data/* MM file loads.
#   - Tests that exercise tf_setenv / tf_unsetenv (covered by Sprint 28
#     PR #36's _putenv_s compat layer in test_framework.h).

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    name: Windows enforced reviewed CMake subset (MSVC)
    runs-on: windows-latest
    env:
      EXPECTED_WINDOWS_CTEST_COUNT: "50"
    steps:
      - uses: actions/checkout@v4

      # The CMake action ships preinstalled on windows-latest images,
      # so no setup step is needed.  MSVC `cl.exe` is available via
      # the Visual Studio environment that GitHub's image initialises.

      - name: Run reviewed CMake configure path (MSVC, x64)
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64
        shell: pwsh

      - name: Run reviewed CMake build path (Release)
        run: cmake --build build --config Release
        shell: pwsh

      - name: Inspect reviewed Windows CTest surface (ctest -N)
        run: |
          $ctestOutput = ctest --test-dir build -C Release -N
          $ctestOutput
          $line = $ctestOutput | Select-String "Total Tests:"
          if (-not $line) {
            throw "Could not find 'Total Tests:' in Windows ctest -N output."
          }
          $count = [int]($line.ToString().Split(':')[-1].Trim())
          Write-Host "Windows CTest registered tests: $count"
          if ($count -ne [int]$env:EXPECTED_WINDOWS_CTEST_COUNT) {
            throw "Expected $env:EXPECTED_WINDOWS_CTEST_COUNT Windows CTest tests, got $count."
          }
          Write-Host "Windows staged exclusions remain: test_threads, test_sprint4_integration, test_fuzz"
        shell: pwsh

      - name: Run reviewed CMake execution path (ctest)
        run: ctest --test-dir build -C Release --output-on-failure
        shell: pwsh
