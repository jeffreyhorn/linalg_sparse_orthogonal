name: Sprint 225 canonical timing gate

# This is a separate one-cell timing decision. Selected performance freshness
# remains threshold-free and cannot satisfy this job.
on:
  push:
    branches: [sprint-225, master]
  pull_request:
    branches: [master]

jobs:
  canonical-refactor-csc-timing:
    name: macOS enforced refactor CSC timing decision (s225-v1)
    runs-on: macos-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Record hosted timing runner context
        run: |
          python3 scripts/record_refactor_csc_timing_host.py \
            --output build/sprint225-host-provenance.json

      - name: Verify accepted baseline before candidate collection
        id: baseline
        run: |
          python3 scripts/check_refactor_csc_timing.py \
            --preflight \
            --output build/sprint225-timing-decision.json

      - name: Build pinned canonical benchmark from clean tree
        if: steps.baseline.outcome == 'success'
        shell: bash
        run: |
          set -o pipefail
          make clean
          mkdir -p build
          make build/bench_refactor_csc SPARSE_IDX_BITS=32 2>&1 | tee build/sprint225-build.log

      - name: Collect raw candidate trial bundle
        if: steps.baseline.outcome == 'success'
        run: |
          python3 scripts/collect_refactor_csc_timing.py \
            --role candidate \
            --output-dir build/sprint225-candidate

      - name: Decide canonical candidate timing
        if: ${{ always() && steps.baseline.outcome == 'success' }}
        run: |
          python3 scripts/check_refactor_csc_timing.py \
            --candidate build/sprint225-candidate \
            --verify-checkout \
            --expected-candidate-commit "$(git rev-parse HEAD)" \
            --output build/sprint225-timing-decision.json

      - name: Upload candidate raw trials and timing decision
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sprint225-timing-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 90
          if-no-files-found: error
          path: |
            build/sprint225-candidate/
            build/sprint225-timing-decision.json
            build/sprint225-host-provenance.json
            build/sprint225-build.log
