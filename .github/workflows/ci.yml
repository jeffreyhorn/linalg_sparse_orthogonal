name: CI

# Linux is the enforced source-of-truth reviewed baseline:
# - reviewed Makefile compile-quality path
# - reviewed CMake parity path
# - dead-code report/check path
# - reviewed static-first package contract path
# - selected hosted oracle/comparison freshness path
# - selected hosted threshold-free performance report freshness path
# It also carries Linux-specific supplemental signals (`make test`,
# `bench-fast`, TSan, coverage). The package contract lane covers the
# maintained static archive install/export/downstream surface only, including
# static pkg-config/CMake metadata and unsupported shared-artifact checks; it
# does not imply shared-library packaging, dynamic ABI compatibility,
# runtime-loader behavior, or package-manager support.
# See README.md "Cross-Platform CI Contract" for the full
# enforced/staged/supplemental model.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    name: Linux supplemental runtime and bench-fast path
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run selected comparison workflow guard
        run: python3 tests/test_selected_comparison_workflow.py

      - name: Run supplemental direct runtime path
        run: make test

      - name: Run supplemental UBSan path
        run: make sanitize

      - name: Run supplemental ASan path
        run: make asan

      # Build all benchmark binaries (compile coverage for slow benches) +
      # run the `bench-fast` subset (genuinely fast benches +
      # `bench_reorder --skip-factor`) to keep a runtime regression signal
      # on PRs without the 6 h timeout that full `make bench` triggered on
      # GHA runners.  Full `make bench` remains a developer-side opt-in for
      # deep wall-time investigations.
      - name: Build supplemental benchmark binaries (compile-only)
        run: make clean && make bench-build

      - name: Run supplemental fast benchmark subset (bench-fast)
        run: make bench-fast

  cmake-build-and-test:
    name: Linux enforced reviewed CMake parity path
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run enforced reviewed CMake parity path
        run: make quality-review-cmake

  package-contract:
    name: Linux reviewed static-first package contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install package proof tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config

      - name: Run Make install and pkg-config package proof
        run: bash tests/test_install.sh

      - name: Run CMake install/export package proof
        run: bash tests/test_cmake_install.sh

      - name: Run static-first package deferral proof
        run: bash scripts/static_package_deferral_check.sh

  generated-report-freshness:
    name: Linux reviewed hosted oracle/comparison freshness
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # This lane promotes only the selected QR/partial-SVD oracle rows and
      # selected comparison rows to reviewed hosted evidence. The comparison
      # surface is limited to the maintained selected families regenerated by
      # `make report-index-comparison-freshness`: QR minimum-norm, QR
      # compatible least-squares, partial-SVD diag6 k2, and linked-list LU
      # nonsymmetric square solve. Other generated report families remain
      # local-only, supplemental, or advisory unless a later sprint explicitly
      # promotes them with their own runtime, artifact, and claim policy.
      - name: Run reviewed hosted oracle freshness
        run: make report-index-oracle-freshness

      - name: Summarize reviewed hosted oracle freshness
        run: |
          python3 - <<'PY'
          import csv
          from pathlib import Path

          oracle_path = Path("build/corpus/oracle/corpus.oracle.tsv")
          manifest_path = Path("build/corpus-reports/manifest.txt")
          rows = list(csv.DictReader(oracle_path.open(newline=""), delimiter="\t"))
          solver_counts = {}
          status_counts = {}
          for row in rows:
              solver_counts[row["solver_family"]] = solver_counts.get(row["solver_family"], 0) + 1
              status = row["comparison_status"]
              status_counts[status] = status_counts.get(status, 0) + 1
          manifest = {}
          for line in manifest_path.read_text(encoding="utf-8").splitlines():
              if "=" in line:
                  key, value = line.split("=", 1)
                  manifest[key] = value
          print(
              "sprint159-oracle-summary: "
              f"total_rows={len(rows)} "
              f"qr_rows={solver_counts.get('qr', 0)} "
              f"partial_svd_rows={solver_counts.get('partial_svd', 0)} "
              f"generated_reference_rows={solver_counts.get('unknown', 0)} "
              f"pass_rows={status_counts.get('pass', 0)}"
          )
          print(
              "sprint159-oracle-summary: "
              f"source_commit={manifest.get('source_commit', 'unknown')} "
              f"source_branch={manifest.get('source_branch', 'unknown')} "
              f"support_tier={manifest.get('support_tier', 'unknown')}"
          )
          PY

      - name: Upload reviewed oracle freshness artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sprint159-oracle-freshness
          retention-days: 7
          if-no-files-found: error
          path: |
            build/corpus/oracle/corpus.oracle.tsv
            build/corpus-reports/index.tsv
            build/corpus-reports/skips.tsv
            build/corpus-reports/manifest.txt

      - name: Run reviewed hosted selected comparison freshness
        run: make report-index-comparison-freshness

      - name: Summarize reviewed hosted selected comparison freshness
        run: |
          python3 - <<'PY'
          import csv
          from pathlib import Path

          targets = [
              ("qr-minnorm", Path("build/comparison/qr_minnorm"), 6),
              ("qr-compatible-ls", Path("build/comparison/qr_compatible_ls"), 6),
              ("partial-svd-diag6-k2", Path("build/comparison/partial_svd_diag6_k2"), 10),
              ("lu-nonsym-square-5", Path("build/comparison/lu_nonsym_square_5"), 6),
          ]
          uploaded_files = [
              "project_observations.tsv",
              "baseline_observations.tsv",
              "dependency_status.tsv",
              "study.tsv",
              "summary.md",
              "manifest.tsv",
          ]
          total_rows = 0
          total_pass_rows = 0
          for label, directory, expected_rows in targets:
              for filename in uploaded_files:
                  artifact_path = directory / filename
                  if not artifact_path.is_file():
                      raise SystemExit(f"{label}: missing uploaded artifact {artifact_path}")
              study_path = directory / "study.tsv"
              deps_path = directory / "dependency_status.tsv"
              manifest_path = directory / "manifest.tsv"
              study_rows = list(
                  csv.DictReader(study_path.open(encoding="utf-8", newline=""), delimiter="\t")
              )
              deps = list(
                  csv.DictReader(deps_path.open(encoding="utf-8", newline=""), delimiter="\t")
              )
              manifest = {
                  row["key"]: row["value"]
                  for row in csv.DictReader(
                      manifest_path.open(encoding="utf-8", newline=""), delimiter="\t"
                  )
              }
              status_counts = {}
              for row in study_rows:
                  status_counts[row["status"]] = status_counts.get(row["status"], 0) + 1
              dep_counts = {}
              deferred_optional = []
              for row in deps:
                  dep_counts[row["status"]] = dep_counts.get(row["status"], 0) + 1
                  if row["status"] == "defer" and row["required"] == "no":
                      deferred_optional.append(row["dependency"])
              pass_rows = status_counts.get("pass", 0)
              if len(study_rows) != expected_rows:
                  raise SystemExit(
                      f"{label}: expected {expected_rows} selected rows, got {len(study_rows)}"
                  )
              if pass_rows < expected_rows:
                  raise SystemExit(f"{label}: expected {expected_rows} pass rows, got {pass_rows}")
              for key in ["source_commit", "source_branch", "platform"]:
                  if not manifest.get(key):
                      raise SystemExit(f"{label}: missing manifest {key}")
              total_rows += len(study_rows)
              total_pass_rows += pass_rows
              print(
                  "sprint175-linux-comparison-summary: "
                  f"target={label} "
                  f"fixture={manifest.get('fixture_key', 'unknown')} "
                  f"selected_rows={len(study_rows)} "
                  f"pass_rows={pass_rows} "
                  f"dependency_pass={dep_counts.get('pass', 0)} "
                  f"dependency_defer={dep_counts.get('defer', 0)} "
                  f"deferred_optional={','.join(deferred_optional) if deferred_optional else 'none'}"
              )
              print(
                  "sprint175-linux-comparison-summary: "
                  f"target={label} "
                  f"source_commit={manifest.get('source_commit', 'unknown')} "
                  f"source_branch={manifest.get('source_branch', 'unknown')} "
                  f"platform={manifest.get('platform', 'unknown')}"
              )
          print(
              "sprint175-linux-comparison-summary: "
              f"selected_targets={len(targets)} "
              f"total_selected_rows={total_rows} "
              f"total_pass_rows={total_pass_rows}"
          )
          PY

      - name: Upload reviewed selected comparison freshness artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sprint175-linux-selected-comparison-freshness
          retention-days: 7
          if-no-files-found: error
          path: |
            build/comparison/qr_minnorm/project_observations.tsv
            build/comparison/qr_minnorm/baseline_observations.tsv
            build/comparison/qr_minnorm/dependency_status.tsv
            build/comparison/qr_minnorm/study.tsv
            build/comparison/qr_minnorm/summary.md
            build/comparison/qr_minnorm/manifest.tsv
            build/comparison/qr_compatible_ls/project_observations.tsv
            build/comparison/qr_compatible_ls/baseline_observations.tsv
            build/comparison/qr_compatible_ls/dependency_status.tsv
            build/comparison/qr_compatible_ls/study.tsv
            build/comparison/qr_compatible_ls/summary.md
            build/comparison/qr_compatible_ls/manifest.tsv
            build/comparison/partial_svd_diag6_k2/project_observations.tsv
            build/comparison/partial_svd_diag6_k2/baseline_observations.tsv
            build/comparison/partial_svd_diag6_k2/dependency_status.tsv
            build/comparison/partial_svd_diag6_k2/study.tsv
            build/comparison/partial_svd_diag6_k2/summary.md
            build/comparison/partial_svd_diag6_k2/manifest.tsv
            build/comparison/lu_nonsym_square_5/project_observations.tsv
            build/comparison/lu_nonsym_square_5/baseline_observations.tsv
            build/comparison/lu_nonsym_square_5/dependency_status.tsv
            build/comparison/lu_nonsym_square_5/study.tsv
            build/comparison/lu_nonsym_square_5/summary.md
            build/comparison/lu_nonsym_square_5/manifest.tsv

  hosted-performance-freshness:
    name: Linux reviewed hosted selected performance freshness
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BENCH_CANONICAL_REPORT_LABEL: sprint-168-hosted-performance
      SPARSE_CANONICAL_SUPPORT_TIER: hosted_selected
      SPARSE_CANONICAL_CLAIM_BOUNDARY: hosted_selected_threshold_free
      SPARSE_CANONICAL_RUNNER_CONTEXT: github-actions-ubuntu-latest
      SPARSE_CANONICAL_BUILD_FLAGS: default_make_flags
      SPARSE_CANONICAL_BUILD_MODE: serial
    steps:
      - uses: actions/checkout@v4

      # This lane promotes only the selected `bench_refactor_csc`
      # canonical report row on `nos4.mtx --repeat 1` to reviewed
      # hosted freshness evidence. It checks methodology metadata,
      # selected row identity, artifact paths, and threshold-free
      # claim boundaries. It is not a timing threshold, portable
      # performance claim, external-library comparison, broad
      # benchmark-family publication, package/ABI claim, or
      # state-of-the-art sparse linear algebra claim.
      - name: Set selected performance metadata
        run: |
          cpu_model="$(awk -F': ' '/model name/ { print $2; exit }' /proc/cpuinfo 2>/dev/null || true)"
          if [ -z "$cpu_model" ]; then
            cpu_model="unknown"
          fi
          echo "SPARSE_CANONICAL_CPU_MODEL=$cpu_model" >> "$GITHUB_ENV"

      - name: Run reviewed hosted selected performance report
        run: make bench-canonical-report

      - name: Check reviewed hosted selected performance freshness
        run: |
          python3 scripts/check_bench_canonical_freshness.py \
            --report-dir build/bench-reports/canonical \
            --mode hosted

      - name: Summarize reviewed hosted selected performance freshness
        run: |
          python3 - <<'PY'
          import csv
          from pathlib import Path

          report_dir = Path("build/bench-reports/canonical")
          index_path = report_dir / "index.tsv"
          manifest_path = report_dir / "manifest.txt"
          rows = list(csv.DictReader(index_path.open(newline=""), delimiter="\t"))
          selected = [row for row in rows if row["artifact"] == "bench_refactor_csc"]
          if len(selected) != 1:
              raise SystemExit(
                  f"expected one selected bench_refactor_csc row, got {len(selected)}"
              )
          row = selected[0]
          manifest = {}
          for line in manifest_path.read_text(encoding="utf-8").splitlines():
              if "=" in line:
                  key, value = line.split("=", 1)
                  manifest[key] = value
          print(
              "sprint168-performance-summary: "
              f"artifact={row['artifact']} "
              f"command={row['command']} "
              f"fixture={row['fixture_or_workload']} "
              f"repeat={row['repeat_semantics']} "
              f"support_tier={row['support_tier']} "
              f"claim_boundary={row['claim_boundary']}"
          )
          print(
              "sprint168-performance-summary: "
              f"report_label={row['report_label']} "
              f"runner_context={row['runner_context']} "
              f"build_flags={row['build_flags']} "
              f"cpu_model={row['cpu_model']} "
              f"build_mode={row['build_mode']} "
              f"omp_num_threads={row['omp_num_threads']}"
          )
          print(
              "sprint168-performance-summary: "
              f"manifest_report_label={manifest.get('report_label', 'unknown')} "
              f"manifest_claim_boundary={manifest.get('claim_boundary', 'unknown')} "
              "non_claims=threshold_free_no_portable_performance_claim"
          )
          PY

      - name: Upload reviewed selected performance freshness artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sprint168-selected-performance-freshness
          retention-days: 7
          if-no-files-found: error
          path: |
            build/bench-reports/canonical/bench_refactor_csc.csv
            build/bench-reports/canonical/bench_chol_csc.csv
            build/bench-reports/canonical/bench_iterative_reuse.csv
            build/bench-reports/canonical/bench_eigs_reuse.csv
            build/bench-reports/canonical/index.tsv
            build/bench-reports/canonical/manifest.txt

  tsan:
    name: Linux supplemental ThreadSanitizer coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build library and thread tests with TSan
        run: |
          make clean
          make build/test_threads \
               CFLAGS="-std=c11 -Wall -Wextra -O1 -g -fsanitize=thread -fno-omit-frame-pointer -Iinclude" \
               LDFLAGS="-fsanitize=thread -lpthread"

      - name: Run thread safety tests under TSan
        run: |
          ./build/test_threads
        env:
          TSAN_OPTIONS: "halt_on_error=1"

      # Sprint 21 Day 5: exercise the OMP-parallel Lanczos MGS
      # kernel under TSan on Ubuntu.  Local `make sanitize-thread`
      # on macOS still runs the same tests against the serial path
      # only.
      #
      # CC=clang here is load-bearing: gcc's `-fopenmp` links
      # libgomp, whose interaction with TSan is even noisier for
      # our OpenMP tests (no annotations on implicit barriers ->
      # races reported on every post-barrier read).  Clang links
      # Ubuntu's libomp when libomp-dev is installed, but that
      # runtime is *not* built with Archer / LIBOMP_TSAN_SUPPORT,
      # so we still expect to suppress false-positive reports from
      # libomp's own barrier / thread-pool internals in the test
      # run below (see `tests/tsan_suppressions.txt`) rather than
      # claiming the OMP runtime is fully TSan-aware.
      - name: Install clang and libomp for TSan OpenMP tests
        run: |
          sudo apt-get update
          sudo apt-get install -y libomp-dev clang

      - name: Build eigensolver tests with TSan + OpenMP
        run: |
          make clean
          make build/test_eigs build/test_eigs_thick_restart \
               CC=clang \
               CFLAGS="-std=c11 -Wall -Wextra -O1 -g -fsanitize=thread -fno-omit-frame-pointer -DSPARSE_OPENMP -fopenmp -Iinclude" \
               LDFLAGS="-fsanitize=thread -fopenmp -lm"

      # LOBPCG is intentionally omitted from this TSan+OMP run.  The
      # Ubuntu CI clang-18 libomp tripped an internal assertion
      # (`kmp_dispatch.cpp(1617): vnew.p.ub * (UT)chunk <= trip` /
      # `OMP: Error #13: Assertion failure`) inside the static-chunked
      # dispatch path on LOBPCG's block-wise OMP-MGS — an LLVM libomp
      # bug, NOT a TSan race or a sparse_eigs.c regression
      # (test_eigs + test_eigs_thick_restart both pass with 215 + 269
      # assertions under the same TSan+OMP build).  The non-TSan
      # build-and-test job + macOS CI continue to cover LOBPCG; this
      # job's OMP-race surface is fully covered by the grow-m Lanczos
      # + Wu/Simon thick-restart paths which share `s21_mgs_reorth`
      # with LOBPCG's reorth.  Sprint 30+ revisits if the libomp bug
      # is patched upstream.
      - name: Run eigensolver tests under TSan + OpenMP
        run: |
          ./build/test_eigs
          ./build/test_eigs_thick_restart
        env:
          # See suppressions file for rationale; Ubuntu's libomp is
          # not Archer-instrumented, so libomp-internal mutex /
          # barrier ops trip TSan even though the OMP semantics are
          # correct.  These suppressions primarily filter OpenMP-
          # runtime false positives, but the broad `called_from_lib:`
          # entries also hide real races in OMP-executed code
          # whenever libomp / libgomp appears anywhere in the stack
          # (the unavoidable cost of TSan against an
          # un-archer-instrumented runtime).  To surface those races
          # reliably, build libomp with `LIBOMP_TSAN_SUPPORT=ON`
          # (archer) or temporarily comment out the
          # `called_from_lib:` lines in the suppressions file.
          TSAN_OPTIONS: "halt_on_error=1 suppressions=tests/tsan_suppressions.txt"
          OMP_NUM_THREADS: "4"

  lint:
    name: Linux enforced reviewed Makefile compile-quality path
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format clang-tidy cppcheck

      - name: Run enforced reviewed Makefile compile-quality path
        run: make quality-review-compile

  deadcode:
    name: Linux enforced dead-code report and completeness path
    runs-on: ubuntu-24.04
    env:
      XUNUSED_REF: b81e0ef09f3afc10d44b777a6760d096a34e3568
    steps:
      - uses: actions/checkout@v4

      - name: Install dead-code tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck clang-18 llvm-18-dev libclang-18-dev ninja-build

      - name: Build and install xunused
        run: |
          git clone --depth=1 https://github.com/mgehre/xunused.git /tmp/xunused
          git -C /tmp/xunused fetch --depth=1 origin "$XUNUSED_REF"
          git -C /tmp/xunused checkout "$XUNUSED_REF"
          llvm_prefix="$(llvm-config-18 --prefix)"
          llvm_cmake_dir="$(llvm-config-18 --cmakedir)"
          clang_cmake_dir="$(dirname "$llvm_cmake_dir")/clang"
          cmake -S /tmp/xunused -B /tmp/xunused/build -G Ninja \
            -DCMAKE_C_COMPILER=clang-18 \
            -DCMAKE_CXX_COMPILER=clang++-18 \
            -DCMAKE_PREFIX_PATH="$llvm_prefix" \
            -DLLVM_DIR="$llvm_cmake_dir" \
            -DClang_DIR="$clang_cmake_dir"
          cmake --build /tmp/xunused/build --parallel
          cmake --install /tmp/xunused/build --prefix "$HOME/.local"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Keep dead-code execution in one serial job so the shared
      # build/artifact paths stay truthful and non-flaky.
      - name: Run enforced dead-code report generation
        run: make deadcode-report

      - name: Run enforced dead-code completeness check
        run: make deadcode-check

      - name: Upload dead-code artifacts on failure or success
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deadcode-report
          path: |
            build/deadcode/report.md
            build/deadcode/report.tsv
            build/deadcode/coverage-notes.txt
            build/deadcode/cppcheck.txt
            build/deadcode/xunused.txt

  coverage:
    name: Linux supplemental coverage report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install lcov
        run: sudo apt-get update && sudo apt-get install -y lcov bc

      - name: Generate coverage report and check threshold
        run: make coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/html/

      - name: Print coverage summary
        if: always()
        run: |
          lcov --summary coverage/coverage-src.info 2>&1 | tail -5
