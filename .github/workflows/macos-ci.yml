name: macOS CI

# macOS enforces the Apple Clang reviewed path plus platform-specific
# checks (`wall-check`, `sanitize`). The Homebrew GCC leg remains
# supplemental second-compiler coverage.
#
# The Make install/`pkg-config` and CMake install/export jobs below are
# reviewed macOS static-first install/export proof for the maintained static
# archive package contract, including downstream consumer and unsupported
# shared-artifact proof. They do not claim shared-library packaging, dynamic
# ABI compatibility, runtime-loader compatibility, package-manager support,
# static/shared selectors, or broader macOS platform parity. See README.md
# "Cross-Platform CI Contract" for the full model.
#
# The selected comparison freshness job promotes only the maintained selected
# QR, partial-SVD, and LU generated comparison artifacts to reviewed hosted
# macOS evidence. It does not claim broad generated report publication,
# Windows report freshness, external-library parity, package/ABI support,
# performance superiority, release evidence, or state-of-the-art status.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    name: macOS enforced Apple Clang reviewed path + supplemental GCC leg
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Clang: default `cc` on macos-latest images.  Add
          # ASan/UBSan via `make sanitize`.
          - compiler: apple-clang
            cc: cc
            run_sanitize: "true"
            run_reviewed_makefile: "true"
            run_reviewed_cmake: "true"
            run_direct_make_test: "false"
          # Homebrew GCC: requires `brew install gcc`.  The exact
          # binary name floats with Homebrew's gcc formula version;
          # use the unversioned symlink `gcc-15` (current Homebrew
          # default as of 2026-04).  Sanitize disabled because the
          # Homebrew gcc + libasan combo is less reliable than Apple
          # Clang's; the Linux CI tsan + Apple Clang sanitize cover
          # the equivalent ground.
          - compiler: homebrew-gcc
            cc: gcc-15
            run_sanitize: "false"
            run_reviewed_makefile: "false"
            run_reviewed_cmake: "false"
            run_direct_make_test: "true"
    steps:
      - uses: actions/checkout@v4

      # Apple Clang ships with the macos-latest image; no install
      # step needed.  Homebrew GCC needs an explicit `brew install`.
      - name: Install Homebrew GCC (matrix=homebrew-gcc)
        if: matrix.compiler == 'homebrew-gcc'
        run: brew install gcc

      # The reviewed compile-quality path depends on clang-format,
      # clang-tidy, and cppcheck. On macOS, use Homebrew LLVM +
      # cppcheck for the Apple Clang leg and add the LLVM bin dir
      # explicitly since the formula is keg-only.
      - name: Install reviewed-path tools (Apple Clang only)
        if: matrix.run_reviewed_makefile == 'true'
        run: |
          brew install llvm cppcheck
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"

      - name: Run enforced reviewed Makefile compile-quality path (Apple Clang only)
        if: matrix.run_reviewed_makefile == 'true'
        run: make quality-review-compile

      - name: Run enforced reviewed CMake parity path (Apple Clang only)
        if: matrix.run_reviewed_cmake == 'true'
        run: make quality-review-cmake

      - name: Run supplemental direct build path (matrix=${{ matrix.compiler }})
        if: matrix.run_direct_make_test == 'true'
        run: make CC=${{ matrix.cc }}

      - name: Run supplemental direct test path (matrix=${{ matrix.compiler }})
        if: matrix.run_direct_make_test == 'true'
        run: make CC=${{ matrix.cc }} test

      - name: Run enforced wall-check signal
        run: make CC=${{ matrix.cc }} wall-check

      - name: Run enforced Apple Clang sanitizer path
        if: matrix.run_sanitize == 'true'
        run: |
          make clean
          make CC=${{ matrix.cc }} sanitize

  # Verify the reviewed macOS static-first Make install/`pkg-config` path.
  # This job installs to a temp prefix and runs the maintained Unix-side
  # package proof script on the hosted macOS runner. It proves the static
  # archive install/`pkg-config` contract only, not shared-library packaging,
  # dynamic ABI compatibility, package-manager support, or broader macOS
  # platform parity.
  install-and-pkgconfig:
    name: macOS reviewed static-first install and pkg-config proof
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run reviewed Make install/pkg-config proof
        run: bash tests/test_install.sh

  # Verify the reviewed macOS static-first CMake install/export path. This
  # job performs a full CMake install/export and downstream find_package proof
  # on the hosted macOS runner, plus the static-first deferral guard. It proves
  # the static CMake package contract only, not shared-library packaging,
  # dynamic ABI compatibility, package-manager support, or broader macOS
  # platform parity.
  cmake-install-export:
    name: macOS reviewed static-first CMake install/export proof
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run reviewed CMake install/export proof
        run: bash tests/test_cmake_install.sh

      - name: Run static-first package deferral proof
        run: bash scripts/static_package_deferral_check.sh

  selected-comparison-freshness:
    name: macOS reviewed selected comparison freshness
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # This lane promotes only selected fixture-local comparison freshness on
      # hosted macOS for the maintained QR minimum-norm, QR compatible
      # least-squares, partial-SVD diag6 k2, and linked-list LU nonsymmetric
      # square-solve targets regenerated by `make report-index-comparison-freshness`.
      # Other generated report families remain local-only, supplemental, or
      # advisory unless a later sprint promotes them with explicit artifacts,
      # runtime policy, and claim wording.
      - name: Run reviewed selected comparison freshness
        run: make report-index-comparison-freshness

      - name: Summarize reviewed selected comparison freshness
        run: |
          python3 - <<'PY'
          import csv
          from pathlib import Path

          targets = [
              ("qr-minnorm", Path("build/comparison/qr_minnorm"), 6),
              ("qr-compatible-ls", Path("build/comparison/qr_compatible_ls"), 6),
              ("partial-svd-diag6-k2", Path("build/comparison/partial_svd_diag6_k2"), 10),
              ("lu-nonsym-square-5", Path("build/comparison/lu_nonsym_square_5"), 6),
          ]
          uploaded_files = [
              "project_observations.tsv",
              "baseline_observations.tsv",
              "dependency_status.tsv",
              "study.tsv",
              "summary.md",
              "manifest.tsv",
          ]
          total_rows = 0
          total_pass_rows = 0
          for label, directory, expected_rows in targets:
              for filename in uploaded_files:
                  artifact_path = directory / filename
                  if not artifact_path.is_file():
                      raise SystemExit(f"{label}: missing uploaded artifact {artifact_path}")
              study_path = directory / "study.tsv"
              deps_path = directory / "dependency_status.tsv"
              manifest_path = directory / "manifest.tsv"
              study_rows = list(
                  csv.DictReader(study_path.open(encoding="utf-8", newline=""), delimiter="\t")
              )
              deps = list(
                  csv.DictReader(deps_path.open(encoding="utf-8", newline=""), delimiter="\t")
              )
              manifest = {
                  row["key"]: row["value"]
                  for row in csv.DictReader(
                      manifest_path.open(encoding="utf-8", newline=""), delimiter="\t"
                  )
              }
              status_counts = {}
              for row in study_rows:
                  status_counts[row["status"]] = status_counts.get(row["status"], 0) + 1
              dep_counts = {}
              deferred_optional = []
              for row in deps:
                  dep_counts[row["status"]] = dep_counts.get(row["status"], 0) + 1
                  if row["status"] == "defer" and row["required"] == "no":
                      deferred_optional.append(row["dependency"])
              pass_rows = status_counts.get("pass", 0)
              if len(study_rows) != expected_rows:
                  raise SystemExit(
                      f"{label}: expected {expected_rows} selected rows, got {len(study_rows)}"
                  )
              if pass_rows < expected_rows:
                  raise SystemExit(f"{label}: expected {expected_rows} pass rows, got {pass_rows}")
              for key in ["source_commit", "source_branch", "platform"]:
                  if not manifest.get(key):
                      raise SystemExit(f"{label}: missing manifest {key}")
              total_rows += len(study_rows)
              total_pass_rows += pass_rows
              print(
                  "sprint175-macos-comparison-summary: "
                  f"target={label} "
                  f"fixture={manifest.get('fixture_key', 'unknown')} "
                  f"selected_rows={len(study_rows)} "
                  f"pass_rows={pass_rows} "
                  f"dependency_pass={dep_counts.get('pass', 0)} "
                  f"dependency_defer={dep_counts.get('defer', 0)} "
                  f"deferred_optional={','.join(deferred_optional) if deferred_optional else 'none'}"
              )
              print(
                  "sprint175-macos-comparison-summary: "
                  f"target={label} "
                  f"source_commit={manifest.get('source_commit', 'unknown')} "
                  f"source_branch={manifest.get('source_branch', 'unknown')} "
                  f"platform={manifest.get('platform', 'unknown')}"
              )
          print(
              "sprint175-macos-comparison-summary: "
              f"selected_targets={len(targets)} "
              f"total_selected_rows={total_rows} "
              f"total_pass_rows={total_pass_rows}"
          )
          PY

      - name: Upload reviewed selected comparison freshness artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sprint175-macos-selected-comparison-freshness
          retention-days: 7
          if-no-files-found: error
          path: |
            build/comparison/qr_minnorm/project_observations.tsv
            build/comparison/qr_minnorm/baseline_observations.tsv
            build/comparison/qr_minnorm/dependency_status.tsv
            build/comparison/qr_minnorm/study.tsv
            build/comparison/qr_minnorm/summary.md
            build/comparison/qr_minnorm/manifest.tsv
            build/comparison/qr_compatible_ls/project_observations.tsv
            build/comparison/qr_compatible_ls/baseline_observations.tsv
            build/comparison/qr_compatible_ls/dependency_status.tsv
            build/comparison/qr_compatible_ls/study.tsv
            build/comparison/qr_compatible_ls/summary.md
            build/comparison/qr_compatible_ls/manifest.tsv
            build/comparison/partial_svd_diag6_k2/project_observations.tsv
            build/comparison/partial_svd_diag6_k2/baseline_observations.tsv
            build/comparison/partial_svd_diag6_k2/dependency_status.tsv
            build/comparison/partial_svd_diag6_k2/study.tsv
            build/comparison/partial_svd_diag6_k2/summary.md
            build/comparison/partial_svd_diag6_k2/manifest.tsv
            build/comparison/lu_nonsym_square_5/project_observations.tsv
            build/comparison/lu_nonsym_square_5/baseline_observations.tsv
            build/comparison/lu_nonsym_square_5/dependency_status.tsv
            build/comparison/lu_nonsym_square_5/study.tsv
            build/comparison/lu_nonsym_square_5/summary.md
            build/comparison/lu_nonsym_square_5/manifest.tsv
