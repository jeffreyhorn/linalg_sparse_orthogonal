name: Windows CI

# Windows currently enforces the reviewed CMake subset only:
# configure + build + `ctest -N` + full `ctest`. The reviewed CMake subset now
# includes the portable `test_threads`, `test_sprint4_integration`, and
# `test_fuzz` targets after Sprint 148 source-portability work. Hosted Windows
# enumeration/execution remains the proof gate for this promotion. The Makefile
# reviewed wrappers and dead-code flow remain staged/deferred. The
# install/downstream job below is supplemental CMake-first static package
# confidence only; it checks the installed static archive, CMake package
# metadata, downstream example, exact-version consumer, and absence of DLL
# artifacts, but it is not a reviewed install-validation lane and does not
# imply Windows Makefile parity, pkg-config parity, shared-library support, or
# dynamic ABI support.
# See README.md "Cross-Platform CI Contract" for the full model.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    name: Windows enforced reviewed CMake consumer subset (MSVC)
    # This reviewed lane depends on the VS 2022 generator being present.
    # `windows-latest` no longer guarantees that, so pin the runner to the
    # image that actually carries the reviewed MSVC/CMake surface.
    runs-on: windows-2022
    env:
      EXPECTED_WINDOWS_CTEST_COUNT: "59"
    steps:
      - uses: actions/checkout@v4

      # CMake ships preinstalled on GitHub's Windows images, so no setup
      # step is needed. This lane is pinned to `windows-2022` specifically
      # because it must provide the VS 2022 generator.

      - name: Run enforced reviewed CMake configure path (MSVC, x64)
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64
        shell: pwsh

      - name: Run enforced reviewed CMake build path (Release)
        run: cmake --build build --config Release
        shell: pwsh

      - name: Inspect enforced Windows reviewed consumer CTest surface (ctest -N)
        run: |
          $ctestOutput = ctest --test-dir build -C Release -N
          $ctestOutput
          $line = $ctestOutput | Select-String "Total Tests:"
          if (-not $line) {
            throw "Could not find 'Total Tests:' in Windows ctest -N output."
          }
          $count = [int]($line.ToString().Split(':')[-1].Trim())
          Write-Host "Windows CTest registered tests: $count"
          if ($count -ne [int]$env:EXPECTED_WINDOWS_CTEST_COUNT) {
            throw "Expected $env:EXPECTED_WINDOWS_CTEST_COUNT Windows CTest tests, got $count."
          }
          Write-Host "Windows reviewed CMake CTest surface includes promoted portable tests: test_threads, test_sprint4_integration, test_fuzz."
          Write-Host "Windows promoted-test proof remains CMake-first: ctest -N count plus full ctest on the hosted MSVC lane."
          Write-Host "Windows reviewed scope remains CMake-first consumer proof only: no reviewed Makefile parity and no separate reviewed install-validation lane."
        shell: pwsh

      - name: Run enforced reviewed CMake execution path (ctest)
        run: ctest --test-dir build -C Release --output-on-failure
        shell: pwsh

  # Verify the maintained static-first CMake install and installed downstream
  # consumer path on Windows. This is supplemental confidence for the
  # CMake-first package story, not a reviewed Windows install-validation lane.
  install-and-downstream:
    name: Windows supplemental CMake install/downstream confidence path
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Run maintained supplemental CMake install/downstream proof
        run: |
          $ErrorActionPreference = "Stop"

          function Invoke-Checked {
            param(
              [string]$Label,
              [scriptblock]$Command
            )

            & $Command
            if ($LASTEXITCODE -ne 0) {
              throw "$Label failed with exit code $LASTEXITCODE."
            }
          }

          $prefix = Join-Path $env:RUNNER_TEMP "sparse-install"
          $build = "build-install"
          $exampleBuild = "build-installed-example"
          $versionExactBuild = "build-version-exact"
          $versionMismatchBuild = "build-version-mismatch"
          $versionExactSrc = Join-Path $env:RUNNER_TEMP "sparse-version-exact-src"
          $versionMismatchSrc = Join-Path $env:RUNNER_TEMP "sparse-version-mismatch-src"
          $version = (Get-Content VERSION -Raw).Trim()

          Invoke-Checked "CMake install configure" {
            cmake -S . -B $build -G "Visual Studio 17 2022" -A x64 `
              -DCMAKE_INSTALL_PREFIX="$prefix" -DCMAKE_INSTALL_LIBDIR=lib
          }
          Invoke-Checked "CMake install build" {
            cmake --build $build --config Release
          }
          Invoke-Checked "CMake install" {
            cmake --install $build --config Release
          }

          $staticLib = Join-Path $prefix "lib/sparse_lu_ortho.lib"
          if (-not (Test-Path $staticLib -PathType Leaf)) {
            throw "Expected installed static library at $staticLib."
          }

          $dlls = @(Get-ChildItem -Path $prefix -Recurse -Filter "*.dll" -File -ErrorAction SilentlyContinue)
          if ($dlls.Count -ne 0) {
            throw "Unexpected shared-library artifacts installed: $($dlls.FullName -join ', ')"
          }

          $headers = @(Get-ChildItem -Path (Join-Path $prefix "include/sparse") -Filter "*.h" -File)
          if ($headers.Count -ne 19) {
            throw "Expected 19 installed headers, got $($headers.Count)."
          }

          foreach ($packageFile in @(
            "lib/cmake/Sparse/SparseConfig.cmake",
            "lib/cmake/Sparse/SparseConfigVersion.cmake",
            "lib/cmake/Sparse/SparseTargets.cmake",
            "lib/pkgconfig/sparse.pc"
          )) {
            $path = Join-Path $prefix $packageFile
            if (-not (Test-Path $path -PathType Leaf)) {
              throw "Expected installed package file at $path."
            }
          }

          $cmakePackageDir = Join-Path $prefix "lib/cmake/Sparse"
          $cmakePackageText = (Get-ChildItem -Path $cmakePackageDir -File |
            ForEach-Object { Get-Content -Path $_.FullName -Raw }) -join "`n"
          if ($cmakePackageText -match "SHARED IMPORTED|MODULE IMPORTED|IMPORTED_LOCATION[^\s]*.*\.(so|dylib|dll)") {
            throw "Installed CMake package metadata unexpectedly contains shared-library imported metadata."
          }

          $pcFile = Join-Path $prefix "lib/pkgconfig/sparse.pc"
          $pcText = Get-Content -Path $pcFile -Raw
          if ($pcText -notmatch "(?m)^Description: Static archive package metadata for sparse linear algebra\r?$") {
            throw "Installed sparse.pc does not describe static archive package metadata."
          }
          if ($pcText -match "(?im)^Libs\.private:|shared|soname|dylib|dll|abi|homebrew|apt|dnf|pacman|vcpkg|conan") {
            throw "Installed sparse.pc unexpectedly contains unsupported package or ABI wording."
          }

          Invoke-Checked "Installed example configure" {
            cmake -S examples/cmake_example -B $exampleBuild `
              -G "Visual Studio 17 2022" -A x64 -DCMAKE_PREFIX_PATH="$prefix"
          }
          Invoke-Checked "Installed example build" {
            cmake --build $exampleBuild --config Release
          }
          $exampleExe = Join-Path (Join-Path $exampleBuild "Release") "example.exe"
          $output = & $exampleExe 2>&1
          $outputText = $output -join "`n"
          if ($LASTEXITCODE -ne 0) {
            throw "Installed CMake example exited with $LASTEXITCODE`: $outputText"
          }
          if ($outputText -notmatch "Sparse library version" -or
              $outputText -notmatch "Solution:" -or
              $outputText -notmatch "OK") {
            throw "Installed CMake example output was unexpected: $outputText"
          }

          New-Item -ItemType Directory -Force -Path $versionExactSrc | Out-Null
          $mainSource = ((Get-Location).Path -replace "\\", "/") + "/examples/cmake_example/main.c"
          Set-Content -Path (Join-Path $versionExactSrc "CMakeLists.txt") -Encoding utf8 -Value @(
            "cmake_minimum_required(VERSION 3.14)",
            "project(sparse_version_exact C)",
            "find_package(Sparse $version EXACT REQUIRED)",
            "add_executable(version_exact `"$mainSource`")",
            "target_link_libraries(version_exact PRIVATE Sparse::sparse_lu_ortho)"
          )

          Invoke-Checked "Exact version configure" {
            cmake -S $versionExactSrc -B $versionExactBuild `
              -G "Visual Studio 17 2022" -A x64 -DCMAKE_PREFIX_PATH="$prefix"
          }
          Invoke-Checked "Exact version build" {
            cmake --build $versionExactBuild --config Release
          }
          $versionExactExe = Join-Path (Join-Path $versionExactBuild "Release") "version_exact.exe"
          $versionExactOutput = & $versionExactExe 2>&1
          $versionExactText = $versionExactOutput -join "`n"
          if ($LASTEXITCODE -ne 0) {
            throw "Exact version consumer exited with $LASTEXITCODE`: $versionExactText"
          }
          if ($versionExactText -notmatch "Sparse library version" -or
              $versionExactText -notmatch "Solution:" -or
              $versionExactText -notmatch "OK") {
            throw "Exact version consumer output was unexpected: $versionExactText"
          }

          $parts = $version.Split(".")
          $major = [int]$parts[0]
          $minor = [int]$parts[1]
          $patch = [int]$parts[2]
          if ($minor -gt 0) {
            $mismatchVersion = "$major.$($minor - 1).0"
          } elseif ($patch -gt 0) {
            $mismatchVersion = "$major.$minor.$($patch - 1)"
          } else {
            throw "Cannot construct lower same-major mismatch version for $version."
          }

          New-Item -ItemType Directory -Force -Path $versionMismatchSrc | Out-Null
          Set-Content -Path (Join-Path $versionMismatchSrc "CMakeLists.txt") -Encoding utf8 -Value @(
            "cmake_minimum_required(VERSION 3.14)",
            "project(sparse_version_mismatch C)",
            "find_package(Sparse $mismatchVersion REQUIRED)"
          )

          cmake -S $versionMismatchSrc -B $versionMismatchBuild `
            -G "Visual Studio 17 2022" -A x64 -DCMAKE_PREFIX_PATH="$prefix"
          if ($LASTEXITCODE -eq 0) {
            throw "Mismatched package version $mismatchVersion unexpectedly configured."
          }
          $global:LASTEXITCODE = 0
        shell: pwsh
