name: Windows CI

# Windows currently enforces the reviewed CMake subset only:
# configure + build + `ctest -N` + full `ctest`. The Makefile reviewed
# wrappers and dead-code flow remain staged, and the current excluded
# tests remain explicit in job output. See README.md
# "Cross-Platform CI Contract" for the full model.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    name: Windows enforced reviewed CMake subset (MSVC)
    runs-on: windows-latest
    env:
      EXPECTED_WINDOWS_CTEST_COUNT: "50"
    steps:
      - uses: actions/checkout@v4

      # The CMake action ships preinstalled on windows-latest images,
      # so no setup step is needed.  MSVC `cl.exe` is available via
      # the Visual Studio environment that GitHub's image initialises.

      - name: Run enforced reviewed CMake configure path (MSVC, x64)
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64
        shell: pwsh

      - name: Run enforced reviewed CMake build path (Release)
        run: cmake --build build --config Release
        shell: pwsh

      - name: Inspect enforced Windows reviewed CTest surface (ctest -N)
        run: |
          $ctestOutput = ctest --test-dir build -C Release -N
          $ctestOutput
          $line = $ctestOutput | Select-String "Total Tests:"
          if (-not $line) {
            throw "Could not find 'Total Tests:' in Windows ctest -N output."
          }
          $count = [int]($line.ToString().Split(':')[-1].Trim())
          Write-Host "Windows CTest registered tests: $count"
          if ($count -ne [int]$env:EXPECTED_WINDOWS_CTEST_COUNT) {
            throw "Expected $env:EXPECTED_WINDOWS_CTEST_COUNT Windows CTest tests, got $count."
          }
          Write-Host "Windows staged exclusions remain: test_threads, test_sprint4_integration, test_fuzz"
        shell: pwsh

      - name: Run enforced reviewed CMake execution path (ctest)
        run: ctest --test-dir build -C Release --output-on-failure
        shell: pwsh
